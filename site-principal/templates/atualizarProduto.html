<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#28724a">
    <title>Atualizar produto</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
    <main class="page">
        <section class="panel form-panel" aria-labelledby="form-title">
            <form id="product-form" method="POST">
                <div class="form-fields">
                    <div class="field">
                        <label for="product-name">Nome do produto</label>
                        <input id="product-name" name="product-name" type="text" maxlength="80"
                               placeholder="Ex.: Suco de laranja" autocomplete="off" value="{{produto.nomeProduto}}" required>
                    </div>
                    <div class="field">
                        <label for="product-quantity">Quantidade</label>
                        <input id="product-quantity" name="product-quantity" type="number" value="{{produto.quantidade}}"
                               min="1" step="1" placeholder="Ex.: 24" required>
                    </div>
                    <div class="field">
                        <label for="product-expiration">Data de validade</label>
                        <input id="product-expiration" name="expiration" value="{{produto.dataValidade}}" type="date" required>
                    </div>
                </div>
                <div class="form-actions">
                    <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
                    <button class="primary-button" type="submit">Editar produto</button>
                </div>
            </form>
        </section>
            <div id="empty-state" class="empty-state">
                <span aria-hidden="true">🥕</span>
                <h3>Seu estoque está vazio</h3>
                <p>Cadastre o primeiro <a href="url_for('validade_produtos')">produto</a></p>
            </div>

            <div id="product-list" class="product-list" aria-live="polite">
            </div>
        </section>
        <!-- <footer>Os produtos ficam salvos neste navegador.</footer> -->
    </main>
    <script src="../static/js/script.js" defer></script>
</body>
</html>
