<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Cadastro</title>
    <link rel="stylesheet" href="../static/css/login.css">
</head>
<body>
    <div class="login-container">
        <h2>Criar Conta</h2>
        <form id="cadastroForm">
            <div class="input-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nomeCompleto" placeholder="Digite seu nome" required>
            </div>
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
            </div>
            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>
            </div>
            <div class="input-group">
                <label for="confirmaSenha">Confirmar Senha</label>
                <input type="password" id="confirmaSenha" placeholder="Repita a senha" required>
            </div>
            <button type="submit">Cadastrar</button>
            <p id="mensagem"></p>
        </form>
        <p class="switch-form">Já tem uma conta? <a href="{{ url_for('login') }}">Faça login</a></p>
    </div>

    <script src="../static/js/cadastro.js"></script>
</body>
</html>
